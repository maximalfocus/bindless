# The only supported way to run this project.
#
# `docker compose up` starts the secure application alone. Nothing here is reachable from outside
# this machine: PostgreSQL is not published at all, and the API is bound to loopback.

name: bindless

# Every application container reaches the database the same way, over the private Compose network.
x-app-environment: &app-environment
  BINDLESS_DATABASE_URL: postgresql+psycopg://bindless:bindless-local-demo@db:5432/bindless
  BINDLESS_SECURE_URL: http://api-secure:8000
  BINDLESS_VULNERABLE_URL: http://api-vulnerable:8000

services:
  db:
    image: postgres:17-alpine
    environment:
      # A local demonstration database on a private container network. It is deliberately not
      # published to the host, so these values never leave the Compose network.
      POSTGRES_USER: bindless
      POSTGRES_PASSWORD: bindless-local-demo
      POSTGRES_DB: bindless
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bindless -d bindless"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # One-shot: drops, recreates, and reloads the deterministic fictional fixtures, then exits.
  # Seeding is deliberately not reachable over HTTP.
  seed:
    build:
      context: .
      target: runtime
    command: ["python", "-m", "bindless.seed"]
    environment: *app-environment
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api-secure:
    build:
      context: .
      target: runtime
    command:
      - uvicorn
      - bindless.secure_app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      # No access log: request lines would record query strings, and query strings carry payloads.
      - --no-access-log
    environment: *app-environment
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import httpx; httpx.get('http://127.0.0.1:8000/healthz').raise_for_status()
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s

  # The intentionally vulnerable application. Starting it takes two deliberate actions: enabling
  # this profile, and setting ALLOW_VULNERABLE_DEMO=true. Without the acknowledgement the process
  # refuses to start, so `--profile vulnerable` alone is not enough.
  api-vulnerable:
    profiles: ["vulnerable"]
    build:
      context: .
      target: runtime
    command:
      - uvicorn
      - bindless.vulnerable_app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
    environment:
      <<: *app-environment
      ALLOW_VULNERABLE_DEMO: ${ALLOW_VULNERABLE_DEMO:-}
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import httpx; httpx.get('http://127.0.0.1:8000/healthz').raise_for_status()
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s

  # The one-shot comparison. Opt-in so the default `docker compose up` leaves the secure API
  # running for manual exploration. It needs the vulnerable app, so it carries the acknowledgement
  # and rides the `vulnerable` profile's service being up.
  demo:
    profiles: ["demo"]
    build:
      context: .
      target: runtime
    command: ["python", "-m", "bindless.cli", "compare"]
    environment: *app-environment
    depends_on:
      api-secure:
        condition: service_healthy
      api-vulnerable:
        condition: service_healthy

  # Ruff, mypy, and pytest — the same boundary locally and in CI.
  checks:
    profiles: ["checks"]
    build:
      context: .
      target: dev
    command:
      - sh
      - -c
      - ruff check . && ruff format --check . && mypy && pytest
    environment:
      <<: *app-environment
      # Running the full suite is itself a deliberate opt-in context: it imports the vulnerable
      # application to test it, and `check.sh` is what sets this. It is never set on the default path.
      ALLOW_VULNERABLE_DEMO: ${ALLOW_VULNERABLE_DEMO:-}
    depends_on:
      api-secure:
        condition: service_healthy
      # The regression matrix has to prove what the vulnerable application actually does, so
      # verification is one of the deliberate contexts in which it is started.
      api-vulnerable:
        condition: service_healthy
